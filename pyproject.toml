[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-dedup"
version = "1.0.0"
description = "Find and remove duplicate images on Google Drive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.100.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.1.0",
  "Pillow>=10.0.0",
  "imagehash>=4.3.1",
  "click>=8.1.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.0",
]

[project.scripts]
drive-dedup = "drive_dedup.cli:main"

[tool.setuptools.packages.find]
include = ["drive_dedup*"]

[tool.setuptools.package-data]
"drive_dedup.web" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
